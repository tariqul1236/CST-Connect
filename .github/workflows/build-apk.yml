name: Build CST Connect Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Real Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build REAL Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Locate and Rename Compiled APK to CST-Connect.apk
        run: |
          echo "Locating compiled release APK..."
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          elif [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            APK_SRC="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            APK_SRC=$(find android/app/build/outputs/apk -type f -name "*.apk" | grep -i "release" | head -n 1)
          fi

          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "::error::Real compiled release APK not found in build outputs!"
            exit 1
          fi

          echo "Found compiled APK: $APK_SRC"
          ls -lh "$APK_SRC"

          cp "$APK_SRC" CST-Connect.apk
          echo "Successfully prepared CST-Connect.apk"
          ls -lh CST-Connect.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CST-Connect-apk
          path: CST-Connect.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with CST-Connect.apk
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "CST Connect v1.0.0"
          body: |
            ### 📱 CST Connect Official Android Release (v1.0.0)

            - **App Name:** CST Connect
            - **Package ID:** `com.cstconnect.app`
            - **Platform:** Android 6.0+
            - **Architecture:** Universal Android APK
            - **Release Asset:** `CST-Connect.apk`

            Official compiled and signed Android APK package for CST students of Narsingdi Government Polytechnic Institute.
          files: CST-Connect.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
