name: Build CST Connect Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Run 'npx cap sync android'
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Execute './gradlew assembleRelease'
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Verify and Prepare Release APK
        run: |
          echo "Verifying compiled APK at android/app/build/outputs/apk/release/app-release.apk..."
          if [ ! -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "::error::Release APK not found at android/app/build/outputs/apk/release/app-release.apk!"
            exit 1
          fi
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk CST-Connect.apk
          ls -lh CST-Connect.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "CST Connect v1.0.0"
          body: |
            ### 📱 CST Connect Official Android Release (v1.0.0)

            - **App Name:** CST Connect
            - **Package ID:** `com.cstconnect.app`
            - **Version:** `1.0.0`
            - **Release Asset:** `CST-Connect.apk` (`app-release.apk`)

            Official compiled and signed Android APK package for CST students of Narsingdi Government Polytechnic Institute.
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            CST-Connect.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
