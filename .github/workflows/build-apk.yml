name: Build CST Connect Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Real Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 1. Install NPM Dependencies
        run: npm install

      - name: 2. Build Web Application
        run: npm run build

      - name: 3. Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: 4. Compile Real Android Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: 5. Locate Real Compiled APK and Prepare CST-Connect.apk
        run: |
          echo "Searching for real compiled APK from Gradle build outputs..."
          # Look for compiled APKs generated by assembleRelease
          APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | grep -i "release" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "Release specific APK name not found, checking all APK outputs..."
            APK_FILE=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::No compiled APK file found in android/app/build/outputs/apk!"
            exit 1
          fi

          echo "Found real compiled APK: $APK_FILE"
          ls -lh "$APK_FILE"

          # Copy and rename to requested APK filename: CST-Connect.apk
          cp "$APK_FILE" CST-Connect.apk
          echo "Successfully created CST-Connect.apk"
          ls -lh CST-Connect.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CST-Connect-Android-APK
          path: CST-Connect.apk
          if-no-files-found: error
          retention-days: 30

      - name: 6 & 7. Create/Update GitHub Release and Upload APK Asset
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "CST Connect Android Release"
          body: |
            ## 📱 CST Connect Official Android App

            Official compiled Android APK for CST Connect.

            - **Package ID**: `com.cstconnect.app`
            - **App Name**: CST Connect
            - **Architecture**: Universal Android (ARM64, ARMv7, x86_64)
            - **Minimum Version**: Android 6.0+ (Marshmallow)
            - **Build System**: Capacitor + Gradle assembleRelease

            ### 📥 Installation Instructions
            1. Download **CST-Connect.apk** below directly to your Android device.
            2. Tap to install the downloaded APK.
            3. If prompted by Android, permit "Install Unknown Apps" for your browser/file manager.
            4. Open CST Connect!
          files: CST-Connect.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
