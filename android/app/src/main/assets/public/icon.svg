<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle circuit tech patterns in background -->
  <g stroke="#ffffff" stroke-width="3" stroke-opacity="0.15" fill="none" stroke-linecap="round">
    <path d="M 64 128 L 160 128 L 192 160 L 192 220" />
    <circle cx="64" cy="128" r="6" fill="#ffffff" fill-opacity="0.2" />
    <circle cx="192" cy="220" r="6" fill="#ffffff" fill-opacity="0.2" />
    
    <path d="M 448 128 L 352 128 L 320 160 L 320 220" />
    <circle cx="448" cy="128" r="6" fill="#ffffff" fill-opacity="0.2" />
    <circle cx="320" cy="220" r="6" fill="#ffffff" fill-opacity="0.2" />

    <path d="M 64 384 L 160 384 L 192 352 L 192 300" />
    <circle cx="64" cy="384" r="6" fill="#ffffff" fill-opacity="0.2" />
    
    <path d="M 448 384 L 352 384 L 320 352 L 320 300" />
    <circle cx="448" cy="384" r="6" fill="#ffffff" fill-opacity="0.2" />
  </g>

  <!-- Central Shield / Phone Container with Shadow -->
  <g filter="url(#shadow)">
    <!-- Smartphone Frame Outline -->
    <rect x="136" y="80" width="240" height="352" rx="36" fill="#ffffff" />
    <rect x="146" y="90" width="220" height="332" rx="28" fill="#0f172a" />
    
    <!-- Phone Top Speaker & Camera -->
    <rect x="226" y="104" width="60" height="6" rx="3" fill="#334155" />
    <circle cx="210" cy="107" r="3" fill="#334155" />

    <!-- Screen Content: CST Connect Logo Symbol -->
    <!-- Graduation Cap / Poly Header -->
    <path d="M 256 145 L 320 175 L 256 205 L 192 175 Z" fill="url(#goldGrad)" />
    <path d="M 216 195 L 216 230 C 216 244 296 244 296 230 L 296 195" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M 315 180 L 315 225 C 315 228 322 232 322 236" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" />

    <!-- Code Brackets & Connect Node in Center -->
    <g stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Left Bracket < -->
      <path d="M 210 260 L 180 285 L 210 310" />
      <!-- Right Bracket > -->
      <path d="M 302 260 L 332 285 L 302 310" />
    </g>

    <!-- CST text inside screen -->
    <text x="256" y="293" font-family="'Outfit', 'Arial', sans-serif" font-weight="800" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">CST</text>
    
    <!-- Subtitle badge: CONNECT -->
    <rect x="200" y="325" width="112" height="24" rx="12" fill="#059669" />
    <text x="256" y="341" font-family="'Outfit', 'Arial', sans-serif" font-weight="700" font-size="11" fill="#ecfdf5" text-anchor="middle" letter-spacing="2">CONNECT</text>
    
    <!-- Phone bottom home bar -->
    <rect x="226" y="402" width="60" height="4" rx="2" fill="#475569" />
  </g>

  <!-- Small institute badge arc -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="12 16" opacity="0.4" />
</svg>
